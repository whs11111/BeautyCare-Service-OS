<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1分钟AI测肤</title>
<style>
  :root {
    --bg: #faf7f5; --card: #ffffff; --ink: #2b2420; --muted: #85786f; --line: #ece4de;
    --accent: #6948f5; --accent-soft: #f0ebff; --ok: #2f7d5b; --warn: #a3542b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1716; --card: #26201e; --ink: #f2ebe7; --muted: #b0a29a; --line: #3a312d;
      --accent: #e48aa6; --accent-soft: #3d2730; --ok: #7fcfa8; --warn: #e3a07b;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1716; --card: #26201e; --ink: #f2ebe7; --muted: #b0a29a; --line: #3a312d;
    --accent: #e48aa6; --accent-soft: #3d2730; --ok: #7fcfa8; --warn: #e3a07b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-weight: 700; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 4px 0 18px; }
  .progress > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
  .q { font-size: 18px; font-weight: 600; margin: 0 0 14px; }
  .opt { display: block; width: 100%; text-align: left; margin: 10px 0; padding: 14px 16px; border-radius: 12px;
    border: 1.5px solid var(--line); background: transparent; color: var(--ink); font-size: 16px; cursor: pointer; }
  .opt:hover { border-color: var(--accent); }
  .opt.on { border-color: var(--accent); background: var(--accent-soft); }
  .opt::before { content: "👉 "; }
  .row { display: flex; gap: 10px; margin-top: 16px; }
  button.primary, button.ghost { flex: 1; padding: 13px; border-radius: 12px; font-size: 16px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border: 0; }
  button.primary:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  textarea { width: 100%; min-height: 90px; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font: inherit; resize: vertical; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft);
    color: var(--accent); font-weight: 600; margin: 0 6px 6px 0; font-size: 14px; }
  .report { margin: 14px 0; padding: 14px; border-radius: 12px; background: var(--accent-soft); }
  .prod { border-top: 1px solid var(--line); padding: 12px 0; }
  .prod b { display: block; }
  .prod .why { color: var(--muted); font-size: 13px; }
  .price { color: var(--accent); font-weight: 600; }
  .excl { color: var(--warn); font-size: 13px; margin-top: 4px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
  .err { color: var(--warn); }
  h3 { font-size: 15px; margin: 18px 0 4px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">AI</div>
    <div><h1 id="title">1分钟 AI 肤质问卷</h1><div class="sub">基于您的自述，结果同步至本次客服画像</div></div>
  </header>
  <section class="card" id="app"><p class="sub">加载中…</p></section>
  <p class="hint">这不是拍照检测或医学诊断。肤质会受季节和环境影响，结果仅供护肤选购参考。</p>
</main>
<script>
const app = document.getElementById('app');
const params = new URLSearchParams(location.search);
const customerId = params.get('c');
let quiz, step = -1;
const answers = {};
let noteDraft = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const productSource = p => { try { const url = new URL(p.source); return url.protocol === 'https:' ? url.href : ''; } catch { return ''; } };

async function load() {
  if (!customerId || !/^[A-Za-z0-9_-]{1,80}$/.test(customerId)) {
    app.innerHTML = '<p class="err">缺少有效客户编号，请从用户咨询页重新打开问卷。</p>';
    return;
  }
  try {
    const res = await fetch('/api/quiz');
    if (!res.ok) throw new Error(res.status);
    quiz = await res.json();
    document.getElementById('title').textContent = quiz.title;
    renderIntro();
  } catch (e) {
    app.innerHTML = '<p class="err">问卷加载失败，请稍后重试。</p>';
  }
}

function renderIntro() {
  app.innerHTML = `<p class="q">${esc(quiz.title)}</p><p>${esc(quiz.intro)}</p>
    <label class="sub"><input id="consent" type="checkbox"> 我同意将回答用于本次护肤建议，并同步给客服。问卷不构成医学诊断。</label>
    <div class="row"><button class="primary" id="start" disabled>开始问卷（${quiz.questions.length}题）</button></div>`;
  document.getElementById('consent').onchange = event => { document.getElementById('start').disabled = !event.target.checked; };
  document.getElementById('start').onclick = () => { step = 0; renderQuestion(); };
}

function renderQuestion() {
  const total = quiz.questions.length;
  if (step >= total) return renderNote();
  const q = quiz.questions[step];
  const chosen = answers[q.id] || [];
  app.innerHTML = `<div class="sub">第 ${step + 1} / ${total} 题${q.multi ? ' · 可多选' : ''}</div>
    <div class="progress"><i style="width:${(step / total) * 100}%"></i></div>
    <p class="q">${esc(q.text)}</p>
    ${q.options.map(o => `<button class="opt ${chosen.includes(o.id) ? 'on' : ''}" data-id="${esc(o.id)}">${esc(o.text)}</button>`).join('')}
    <div class="row">
      <button class="ghost" id="back">${step === 0 ? '返回' : '上一题'}</button>
      ${q.multi ? `<button class="primary" id="next" ${chosen.length ? '' : 'disabled'}>下一题</button>` : ''}
    </div>`;
  app.querySelectorAll('.opt').forEach(btn => btn.onclick = () => choose(q, btn.dataset.id));
  document.getElementById('back').onclick = () => { step === 0 ? renderIntro() : (step--, renderQuestion()); };
  const next = document.getElementById('next');
  if (next) next.onclick = () => { step++; renderQuestion(); };
}

function choose(q, id) {
  if (!q.multi) { answers[q.id] = [id]; step++; return renderQuestion(); }
  const option = q.options.find(o => o.id === id);
  let list = answers[q.id] || [];
  if (option.exclusive) list = list.includes(id) ? [] : [id];
  else {
    list = list.filter(x => !q.options.find(o => o.id === x)?.exclusive);
    list = list.includes(id) ? list.filter(x => x !== id) : [...list, id];
    if (q.maxSelect && list.length > q.maxSelect) list = list.slice(-q.maxSelect);
  }
  answers[q.id] = list;
  renderQuestion();
}

function renderNote() {
  app.innerHTML = `<div class="progress"><i style="width:100%"></i></div>
    <p class="q">还有想补充的吗？（选填）</p>
    <textarea id="note" maxlength="1000" placeholder="例如：换季容易起皮，对香味敏感，想要清爽一点的面霜…">${esc(noteDraft)}</textarea>
    <div class="row"><button class="ghost" id="back">上一题</button><button class="primary" id="submit">生成测肤报告</button></div>`;
  document.getElementById('back').onclick = () => { step--; renderQuestion(); };
  document.getElementById('submit').onclick = submit;
}

async function submit() {
  const note = noteDraft = document.getElementById('note').value;
  app.innerHTML = '<p class="q">正在整理您的肤质问卷…</p><p class="sub">先按回答分析，再生成护肤建议，请稍候。</p>';
  try {
    const res = await fetch(`/api/quiz/${encodeURIComponent(customerId)}/submit`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({answers, note})
    });
    if (!res.ok) throw new Error(res.status);
    renderResult(await res.json());
    try { localStorage.setItem('beautycare-profile-update', JSON.stringify({ customerId, time: Date.now() })); } catch {}
  } catch (e) {
    app.innerHTML = '<p class="err">提交失败，请稍后重试。</p><div class="row"><button class="primary" onclick="renderNote()">返回</button></div>';
  }
}

function formatProductReasons(reasons = []) {
  const groups = { '匹配需求': [], '商品功能': [], '商品成分': [], '适用肤质': [], '商品特点': [] };
  const notes = [];
  const ingredientNames = new Set(['葡萄籽', '玻尿酸', '透明质酸', '玻色因', '胜肽', '神经酰胺', '视黄醇', 'A醇', '烟酰胺', '二裂酵母', '花蜜', '松露', '氨基酸', '维生素C', 'VC', '水杨酸', '燕窝酸']);
  for (const value of reasons || []) {
    const reason = String(value).trim();
    if (!reason) continue;
    if (/尚未核实|未核实|未确认|本推荐仅|候选参考|预算/.test(reason)) { notes.push(reason); continue; }
    if (reason.startsWith('针对')) { groups['匹配需求'].push(reason.slice(2)); continue; }
    if (reason.startsWith('官网需选择')) { notes.push('购买提示：' + reason); continue; }
    if (/^(商品定位[：:]|适合)/.test(reason)) { groups['适用肤质'].push(reason.replace(/^(商品定位[：:]|适合)/, '')); continue; }
    if (reason.startsWith('商品资料提及')) { groups['商品成分'].push(reason.slice(6)); continue; }
    if (reason.startsWith('含') && !reason.startsWith('含量')) { groups['商品成分'].push(reason.slice(1)); continue; }
    if (/妆效符合偏好$/.test(reason)) { groups['商品特点'].push(reason.replace('妆效符合偏好', '妆效')); continue; }
    if (reason.startsWith('无')) { notes.push(reason); continue; }
    reason.split('、').filter(Boolean).forEach(part => {
      const ingredients = part.split('+');
      if (ingredients.every(term => ingredientNames.has(term))) groups['商品成分'].push(...ingredients);
      else if (/保湿|补水|控油|定妆|持妆|遮瑕|淡纹|淡化眼纹|抗皱|提拉|紧致|防晒|修护|舒缓|美白|清洁|清痘|去黑头|润色|提亮/.test(part)) groups['商品功能'].push(part);
      else groups['商品特点'].push(part);
    });
  }
  return [...Object.entries(groups).filter(([, values]) => values.length).map(([label, values]) => label + '：' + [...new Set(values)].join('、')), ...notes];
}

function questionnaireReasons(product, result) {
  const original = product.reasons || [];
  const lines = original.filter(reason => !/尚未核实|未核实|未确认|本推荐仅|候选参考/.test(reason));
  const unverified = [];
  if (result.sensitive && original.some(reason => reason.includes('敏感肌') && reason.includes('未核实'))) {
    unverified.push('尚未核实敏感肌适用性，使用前请先局部试用');
  }
  if (!product.ingredientsVerified) {
    (result.avoid || []).forEach(value => {
      const ingredient = String(value).replace(/^含/, '');
      if (ingredient) unverified.push('尚未核实是否含' + ingredient + '，请以包装成分表为准');
    });
  }
  original.filter(reason => reason.startsWith('所需成分') && reason.includes('尚未核实')).forEach(reason => {
    unverified.push('尚未核实是否含' + reason.slice(4).split('尚未核实')[0] + '，不作为已匹配条件');
  });
  lines.push(...new Set(unverified));
  if (unverified.length || original.some(reason => /本推荐仅|候选参考/.test(reason))) {
    lines.push('本推荐仅按已确认的其他需求匹配。');
  }
  return formatProductReasons(lines);
}

function renderResult(r) {
  const rec = r.recommendation || {items: [], excludedHotItems: []};
  const tags = [r.skinType || '肤质待确认', r.sensitive ? '偏敏感' : null, ...r.concerns.slice(0, 3)].filter(Boolean);
  app.innerHTML = `<p class="q">你的测肤结果</p>
    <div>${tags.map(t => `<span class="badge">${esc(t)}</span>`).join('')}</div>
    ${r.avoid.length ? `<div class="sub">成分规避需求：${esc(r.avoid.join('、'))}</div>` : ''}
    <div class="report"><small>${r.reportMode === 'AI' ? 'AI 辅助护肤建议' : '基于问卷规则生成的护肤建议'}</small><div>${esc(r.report)}</div></div>
    <h3>为你挑选</h3>
    ${rec.items.length ? rec.items.map(p => `<div class="prod"><b>${esc(p.name)} ${p.price > 0 ? `<span class="price">¥${esc(p.price)}</span>` : '<span class="sub">价格待确认</span>'}</b>
      <div class="why">${questionnaireReasons(p, r).map(reason => `<div>${esc(reason)}</div>`).join('')}</div>
      ${productSource(p) ? `<a href="${esc(productSource(p))}" target="_blank" rel="noopener noreferrer">查看商品来源</a>` : ''}
      ${(p.cautions || []).map(c => `<div class="excl">⚠ ${esc(c)}</div>`).join('')}</div>`).join('') : '<p class="sub">暂未匹配到合适商品，客服会为你人工推荐。</p>'}
    <div class="row"><button class="ghost" id="again">重新测试</button></div>`;
  document.getElementById('again').onclick = () => { Object.keys(answers).forEach(k => delete answers[k]); step = 0; renderQuestion(); };
}

load();
</script>
</body>
</html>
